[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amharic-morph"
dynamic = ["version"]
description = "Morphologically aware Amharic tokenization at four levels: morpheme, fidel, sound and root."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dawit" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["amharic", "tokenizer", "morphology", "ethiopic", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
bpe = ["sentencepiece>=0.2.0"]
dev = ["pytest>=8.0", "build>=1.2", "hatchling>=1.25", "twine>=5.0", "sentencepiece>=0.2.0"]

[project.scripts]
amharic-morph = "amharic_morph.__main__:main"

[project.urls]
Repository = "https://github.com/deve1070/amharic_tokenizer"

[tool.hatch.version]
path = "src/amharic_morph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/amharic_morph"]

[tool.hatch.build.targets.sdist]
include = ["src/amharic_morph", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["packaging: builds and installs the wheel; run with -m packaging"]
addopts = "-m 'not packaging'"
# sentencepiece's compiled bindings warn on import under Python 3.12+.
filterwarnings = ["ignore:builtin type swigvarlink has no __module__:DeprecationWarning"]
